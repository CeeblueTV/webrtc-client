<html lang="en">
    <head>
        <title>Ceeblue WebRTC Player</title>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
        <meta name="color-scheme" content="light dark">

        <link rel="icon" href="./assets/ceeblue-logo-32x32.png" sizes="32x32">
        <link rel="icon" href="./assets/ceeblue-logo-192x192.png" sizes="192x192">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

        <link href="./css/solid.css" rel="stylesheet">
        <link href="./css/fontawesome.css" rel="stylesheet">
        <link href="./css/main.css" rel="stylesheet">
        <script src="./js/theme.js"></script>
    </head>
    <body>
        <div class="shell" id="main" v-cloak>

            <header class="hdr">
                <img alt="Ceeblue" src="./assets/ceeblue-logo.png">
                <h1>
                    WebRTC <em>Player</em>
                </h1>
                <button class="theme-btn" :title="themeTooltip()" @click="cycleTheme()">
                    <i class="fas" :class="themeIcon()"></i>
                </button>
            </header>

            <div class="stage">

                <!-- Video + settings: left column in side-by-side mode -->
                <div class="stage-main">
                    <!-- Video -->
                    <div class="player" ref="player"
                        @mouseenter="onPlayerActivity()"
                        @mousemove="onPlayerActivity()"
                        @mouseleave="onPlayerLeave()"
                        @touchstart="onPlayerTouch($event)"
                        @contextmenu="onPlayerContextMenu($event)">

                        <video autoplay id="video" ref="video" playsinline></video>

                        <!-- Hover/touch revealed controls (only while playing) -->
                        <div class="player-ctrls"
                            :class="{ 'is-active': isPlaying(), 'is-visible': controlsVisible }">
                            <button class="pc-btn pc-full"
                                :title="isFullscreen ? 'Exit fullscreen' : 'Fullscreen'"
                                @click="fullscreen()">
                                <i class="fas" :class="isFullscreen ? 'fa-compress' : 'fa-expand'"></i>
                            </button>
                            <button class="pc-btn pc-stop" title="Stop" @click="play()">
                                <i class="fas fa-stop"></i>
                            </button>
                        </div>

                        <!-- Stopped → big Play | Starting → spinner -->
                        <button class="player-action" title="Play" @click="play()" v-if="isStopped()">
                            <i class="fas fa-play"></i>
                        </button>
                        <div class="player-action is-loading" v-else-if="isStarting()">
                            <div class="ring"></div>
                        </div>

                        <div class="player-alert" v-if="streamError">
                            <i class="fas fa-exclamation-triangle"></i>
                            <div class="player-alert-body">
                                <div class="player-alert-title">
                                    <span class="player-alert-type" v-if="streamError.type">{{ streamError.type }}</span>
                                    <span class="player-alert-name">{{ streamError.name }}</span>
                                </div>
                                <div class="player-alert-detail" v-if="streamError.detail">{{ streamError.detail }}</div>
                                <div class="player-alert-fields" v-if="streamError.fields.length">
                                    <span class="player-alert-field" v-for="f in streamError.fields" :key="f.label">
                                        <strong>{{ f.label }}</strong>{{ f.value }}
                                    </span>
                                </div>
                            </div>
                            <button class="player-alert-x" @click="setStreamError(null)"
                                title="Dismiss" aria-label="Dismiss">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Settings: track selects, connector, stream input, mute -->
                    <div class="settings-panel" :class="{ collapsed: controlsHidden }">
                        <button class="controls-toggle"
                            :title="controlsHidden ? 'Show stream settings' : 'Hide stream settings'"
                            :aria-label="controlsHidden ? 'Show stream settings' : 'Hide stream settings'"
                            :aria-expanded="!controlsHidden"
                            @click="controlsHidden = !controlsHidden">
                            <i class="fas fa-sliders"></i>
                            <span>Stream settings</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div v-show="!controlsHidden">
                            <!-- Track selects (a WHEP connector can't switch tracks) -->
                            <div class="row2 gap-panel">
                                <div>
                                    <span class="lbl">Video track</span>
                                    <select class="sel" id="video-track-selection"
                                        :disabled="!player || !player.controller"
                                        v-model="videoTrackId" @change="onVideoTrackChange()">
                                        <option :value="undefined" :key="videoTrack">AUTO — {{ videoTrack }}</option>
                                        <option v-for="[idx, track] of videoTracks" :value="idx">{{ track }}</option>
                                    </select>
                                </div>
                                <div>
                                    <span class="lbl">Audio track</span>
                                    <select class="sel" id="audio-track-selection"
                                        :disabled="!player || !player.controller"
                                        v-model="audioTrackId" @change="onAudioTrackChange()">
                                        <option :value="undefined" :key="audioTrack">AUTO — {{ audioTrack }}</option>
                                        <option v-for="[idx, track] of audioTracks" :value="idx">{{ track }}</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Connector + stream name + access token + mute -->
                            <div class="webrtc-connect gap-panel">
                                <div>
                                    <span class="lbl">Connector</span>
                                    <select class="sel" :disabled="!isStopped()" v-model="connectorType">
                                        <option v-for="type in connectorTypes" :value="type">{{ type }}</option>
                                    </select>
                                </div>
                                <div>
                                    <span class="lbl">Stream name</span>
                                    <input class="inp" :disabled="!isStopped()"
                                        placeholder="as+30189afc-541d-49b7-9ae0-468d15f62059"
                                        type="text" v-model="streamName" @keyup.enter="play()">
                                </div>
                                <div>
                                    <span class="lbl">Access token</span>
                                    <input class="inp" :disabled="!isStopped()"
                                        placeholder="cc0f52bb-92bb-462b-8218-88c3febe8533"
                                        type="text" v-model="accessToken" @keyup.enter="play()">
                                </div>
                                <button class="btn webrtc-mute" title="Mute or unmute audio" @click="mute()">
                                    <i class="fas" :class="{ 'fa-volume-up': !muted, 'fa-volume-xmark': muted }"></i>
                                    {{ muted ? 'Unmute' : 'Mute' }}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Panel: graph / messages (docks bottom by default, or right on wide screens) -->
                <div class="stage-panel">
                    <div class="tab-bar">
                        <button class="tab-btn" :class="{ on: activeBottomTab === 'graph' }"
                            @click="selectBottomTab('graph')">Graph</button>
                        <button class="tab-btn" :class="{ on: activeBottomTab === 'messages' }"
                            @click="selectBottomTab('messages')">
                            Messages
                            <span class="tab-badge" v-if="unreadMessages > 0">{{ unreadMessages }}</span>
                        </button>
                        <button class="layout-btn" :class="{ on: sidePanel }"
                            :title="sidePanel ? 'Dock the panel to the bottom' : 'Dock the panel to the right (side-by-side)'"
                            @click="toggleSidePanel()">
                            <i class="fas fa-table-columns"></i>
                        </button>
                    </div>

                    <div class="tab-body">
                        <!-- Graph -->
                        <div v-show="activeBottomTab === 'graph'">
                            <ul class="stats-list" ref="stats"></ul>
                            <div class="stats-actions" v-show="hasMetrics">
                                <img alt="Reset" title="Reset incremental metrics and rescale the chart"
                                    @click="resetMetrics()" src="./assets/reload.png">
                                <img alt="Download CSV" title="Download metrics as a CSV file"
                                    @click="downloadStats()" src="./assets/download.png">
                            </div>
                        </div>

                        <!-- Messages -->
                        <div v-show="activeBottomTab === 'messages'">
                            <div class="msg-box" ref="messagesPanel">
                                <div class="msg-empty" v-if="messages.length === 0">No data messages received yet.</div>
                                <div v-for="(message, idx) in messages" :key="idx" class="msg-row">
                                    <span class="msg-track">[{{ message.track }}]</span>
                                    <span class="msg-time"> {{ message.receivedAt }} </span>{{ message.text }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <!-- #main -->
        </div>
        <!-- .shell -->
    </body>
    <script type="module">
        import { Player, HTTPConnector, WSController, VERSION, utils } from "../dist/webrtc-client.bundle.js";
        // development version, includes helpful console warnings
        // import { createApp } from 'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.js';
        // production version, optimized for size and speed
        import { createApp, nextTick } from 'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js';
        import {
            themeMixin, sidePanelMixin, overlayMixin, metricsMixin,
            normalizeError, setURLParam, replaceURL, setupDebugOverlay, logMediaEvents
        } from './js/common.js';
        const { EpochTime, Util, Connect, LogLevel, log, UIMetrics } = utils;

        // displays logs ERROR, WARN & INFO logs,
        // can be even more detailed with LogLevel.DEBUG
        log.level = LogLevel.INFO;

        const options = Util.caseInsensitive(Util.options());

        // On-screen log overlay for on-device debugging (e.g. Android with no working
        // chrome://inspect). Append `?debugoverlay` to the URL to enable.
        if (options.debugoverlay) {
            setupDebugOverlay();
        }

        log('webrtc-client version:', VERSION).info();
        log('web-utils version:', utils.VERSION).info();

        const PlayState = {
            PLAYING: 'PLAYING',
            STARTING: 'STARTING',
            STOPPED: 'STOPPED'
        };

        const CONNECTOR_WS = 'WebSocket (WS)';
        const CONNECTOR_WHEP = 'WHEP (HTTP)';

        // Beyond that the oldest rows are dropped, the messages panel is a tail not an archive.
        const MAX_MESSAGES = 200;

        createApp({
            mixins: [themeMixin, sidePanelMixin, overlayMixin, metricsMixin],
            data() {
                return {
                    playState: PlayState.STOPPED,

                    endPoint: '',
                    streamName: '',
                    accessToken: '',
                    muted: true,
                    connectorType: CONNECTOR_WS,
                    connectorTypes: [CONNECTOR_WS, CONNECTOR_WHEP],

                    sidePanel: options.sidePanel ? true : false, // dock the metrics panel to the right (large screens)
                    controlsHidden: false,

                    canvas: document.createElement('canvas'),

                    startTime: 0,
                    videoTracks: new Map(),
                    videoTrack: 'Video',
                    videoTrackId: undefined,
                    audioTracks: new Map(),
                    audioTrack: 'Audio',
                    audioTrackId: undefined,
                    streamError: null,

                    // Bottom panel
                    activeBottomTab: 'graph',
                    messages: [],
                    unreadMessages: 0,

                    player: null
                }
            },
            mounted() {
                // init values, buildURL unpacks the stream name when the endPoint carries it
                const params = {
                    endPoint: options.endPoint?.toLowerCase() || location.hostname,
                    streamName: options.streamName,
                    accessToken: options.accessToken
                };
                options.whep ||= params.endPoint.startsWith('http');
                Connect.buildURL(Connect.Type.WEBRTC, params, options.whep ? 'https' : 'wss');
                this.endPoint = params.endPoint;
                this.streamName = params.streamName || '';
                this.accessToken = params.accessToken || '';
                this.connectorType = options.whep ? CONNECTOR_WHEP : CONNECTOR_WS;

                // Debug: log raw <video> media events to diagnose freezes (append ?events to the URL).
                if (options.events) {
                    logMediaEvents(this.$refs.video);
                }

                // Offscreen canvas used to decode the EpochTime timestamp burnt in the video image
                const drawContext = this.canvas.getContext('2d');

                // Stats to be displayed in the UI
                const bandwidths = []; this.stats.set("Bandwidth", bandwidths);
                const bufferAmounts = []; this.stats.set("Buffer", bufferAmounts);
                const e2eLatencies = []; this.stats.set("Latency e2e", e2eLatencies);
                const playbackSpeeds = []; this.stats.set("Playback speed", playbackSpeeds);
                const fps = []; this.stats.set("Video FPS", fps);
                const trackAudio = []; this.stats.set("Track audio", trackAudio);
                const trackVideo = []; this.stats.set("Track video", trackVideo);
                const skippedAudio = []; this.stats.set("Skipped audio", skippedAudio);
                const skippedVideo = []; this.stats.set("Skipped video", skippedVideo);
                const stalls = []; this.stats.set("Stalls", stalls);
                const packetsLost = []; this.stats.set("Packet loss", packetsLost);
                const nack = []; this.stats.set("Nack", nack);
                const rtt = []; this.stats.set("RTT", rtt);
                const jitter = []; this.stats.set("Jitter", jitter);

                this.uiStats = new UIMetrics(this.$refs.stats);

                this._metricsTimer = setInterval(() => {
                    const player = this.player;
                    if (player) {
                        this.hasMetrics = true;
                        const stats = player.computeStats();
                        const byteRate = (stats.audioByteRate ?? 0) + (stats.videoByteRate ?? 0) + (stats.dataByteRate ?? 0);
                        bandwidths.push((byteRate * 8).toFixed(0) + 'kbps');
                        bufferAmounts.push((stats.bufferAmount ?? 0).toFixed(0) + 'ms');
                        playbackSpeeds.push((stats.playbackSpeed ?? 0).toFixed(2));
                        fps.push(stats.videoPerSecond ?? 0);
                        trackAudio.push(((stats.audioTrackBandwidth ?? 0) * 8 / 1000).toFixed(0) + 'kbps');
                        trackVideo.push(((stats.videoTrackBandwidth ?? 0) * 8 / 1000).toFixed(0) + 'kbps');
                        skippedAudio.push((((stats.skippedAudio ?? 0) - (this.deltaStats.skippedAudio ?? 0)) / 1000).toFixed(1) + 's');
                        skippedVideo.push((((stats.skippedVideo ?? 0) - (this.deltaStats.skippedVideo ?? 0)) / 1000).toFixed(1) + 's');
                        stalls.push((stats.stallCount ?? 0) - (this.deltaStats.stallCount ?? 0));
                        packetsLost.push((stats.lostPacketCount ?? 0) - (this.deltaStats.lostPacketCount ?? 0));
                        nack.push((stats.nackCount ?? 0) - (this.deltaStats.nackCount ?? 0));
                        rtt.push(((stats.rtt ?? 0) * 1000).toFixed(0) + 'ms');
                        jitter.push(((stats.jitter ?? 0) * 1000).toFixed(0) + 'ms');

                        // Displayed only when the stream carries a decodable EpochTime timestamp
                        const e2eLatency = EpochTime.getLatency(this.$refs.video, this.canvas, drawContext);
                        if (e2eLatencies.length || (e2eLatency > 0 && e2eLatency < 0xFFFF)) {
                            e2eLatencies.push(e2eLatency + 'ms');
                        }
                        this.times.push({
                            time: new Date().toISOString(),
                            mediaTime: this.$refs.video.currentTime || 0
                        });
                    }
                    this.uiStats.display(this.stats);
                }, 700);
            },
            beforeUnmount() {
                clearInterval(this._metricsTimer);
                if (this.player) {
                    this.player.stop();
                }
            },
            methods: {
                setStreamError(error) {
                    this.streamError = normalizeError(error);
                },
                // Overlay controls only show while playing
                overlayActive() {
                    return this.isPlaying();
                },

                play() {
                    if (this.player) {
                        this.player.stop();
                        return;
                    }
                    this.startTime = Util.time();
                    // reset error and stats
                    this.setStreamError(null);
                    this.resetMetrics(true);
                    this.resetMessages();

                    const params = {
                        endPoint: this.endPoint,
                        streamName: this.streamName.trim(),
                        accessToken: this.accessToken.trim() || undefined
                    };
                    if (!params.streamName) {
                        this.setStreamError({
                            type: 'Input',
                            name: 'Missing stream',
                            detail: 'Enter a non-empty stream name to play.'
                        });
                        return;
                    }
                    log('Play stream', params.streamName, 'with', this.connectorType).info();
                    this.updateURL();

                    this.playState = PlayState.STARTING;

                    const videoElement = this.$refs.video;
                    videoElement.muted = this.muted;
                    videoElement.autoplay = true;
                    videoElement.onloadeddata = () => {
                        log('TTFF :', Util.time() - this.startTime).info();
                        videoElement.play().catch(error => log('Video play', error).warn());
                    };

                    this.player = new Player(videoElement, this.connectorType === CONNECTOR_WS ? WSController : HTTPConnector);
                    this.player.onStart = this.onStart.bind(this);
                    this.player.onStop = this.onStop.bind(this);
                    this.player.onPlaying = this.onPlaying.bind(this);
                    this.player.onMetadata = this.onMetadata.bind(this);
                    this.player.onData = (time, track, data) => {
                        this.pushMessage(track, data);
                        log(`Data reception ${Util.stringify({ track, time, data })}`).info();
                    };
                    this.player.start(params);

                    // Report the player stats every second as an HTTP JSON POST (import Telemetry),
                    // reporting stops by itself with the player
                    // const telemetry = new Telemetry('https://address/metrics');
                    // telemetry.report(this.player.computeStats(), 1);
                },
                onStart(stream) {
                    log('onStart').info();
                    this.playState = PlayState.PLAYING;
                    this.$refs.video.srcObject = stream;
                },
                onStop(error) {
                    if (error) {
                        log('onStop', error).error();
                        this.setStreamError(error);
                    } else {
                        log('onStop').info();
                    }
                    const videoElement = this.$refs.video;
                    videoElement.srcObject = null;
                    videoElement.onloadeddata = null;

                    this.audioTracks = new Map();
                    this.audioTrack = 'Audio';
                    this.audioTrackId = undefined;
                    this.videoTracks = new Map();
                    this.videoTrack = 'Video';
                    this.videoTrackId = undefined;

                    this.player = null;
                    this.playState = PlayState.STOPPED;
                    this.hideControls();
                },
                onPlaying(playing) {
                    if (this.videoTrackId != null) {
                        this.videoTrackId = this.player.videoTrack;
                    }
                    this.videoTrack = this.videoTracks.get(this.player.videoTrack) || 'Video';
                    if (this.audioTrackId != null) {
                        this.audioTrackId = this.player.audioTrack;
                    }
                    this.audioTrack = this.audioTracks.get(this.player.audioTrack) || 'Audio';
                    log(`Position ${playing.begin}>>[${playing.current}]>>${playing.end}`).debug();
                },
                onMetadata(metadata) {
                    log(`onMetadata ${Util.stringify(metadata)}`).info();

                    // Subscribe to all data tracks by default, can be changed later with player.dataTracks = [idx1, idx2]
                    this.player.dataTracks = metadata.datas.map(track => track.idx);

                    this.audioTracks = new Map();
                    this.videoTracks = new Map();
                    for (const [id, track] of metadata.tracks) {
                        const bitrate = ((track.ebps || track.bps) * 8 / 1000).toFixed(0);
                        if (track.type === 'video') {
                            this.videoTracks.set(id, `${track.codec} ${track.width}x${track.height} ${bitrate}kbps`);
                        } else if (track.type === 'audio') {
                            this.audioTracks.set(id, `${track.codec} ${track.channels}ch ${track.rate}Hz ${bitrate}kbps`);
                        }
                    }
                },
                onVideoTrackChange() {
                    if (this.player) {
                        this.player.videoTrack = this.videoTrackId;
                    }
                },
                onAudioTrackChange() {
                    if (this.player) {
                        this.player.audioTrack = this.audioTrackId;
                    }
                },

                // ── Bottom panel: tabs and data messages ──
                selectBottomTab(tab) {
                    this.activeBottomTab = tab;
                    if (tab === 'messages') {
                        this.unreadMessages = 0;
                        this.scrollMessagesToBottom();
                    }
                },
                resetMessages() {
                    this.messages = [];
                    this.unreadMessages = 0;
                    this.activeBottomTab = 'graph';
                },
                formatReceptionTime(date = new Date()) {
                    return date.toLocaleTimeString([], {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                },
                scrollMessagesToBottom() {
                    nextTick(() => {
                        const panel = this.$refs.messagesPanel;
                        if (panel) {
                            panel.scrollTop = panel.scrollHeight;
                        }
                    });
                },
                pushMessage(track, data) {
                    this.messages.push({
                        track,
                        receivedAt: this.formatReceptionTime(),
                        // One row per message: newlines would break the fixed-height monospace layout
                        text: Util.stringify(data).replace(/[\r\n]+/g, ' ')
                    });
                    if (this.messages.length > MAX_MESSAGES) {
                        this.messages.splice(0, this.messages.length - MAX_MESSAGES);
                    }
                    if (this.activeBottomTab !== 'messages') {
                        this.unreadMessages += 1;
                    }
                    this.scrollMessagesToBottom();
                },

                mute() {
                    this.muted = !this.muted;
                    this.$refs.video.muted = this.muted;
                    log(this.muted ? 'MutePlayback' : 'UnmutePlayback').info();
                },

                resetMetrics(all = false) {
                    this.uiStats.reset();
                    // Rebaseline the counters the Player reports cumulatively, so the chart
                    // shows what happened since this reset and not since the stream started.
                    if (this.player) {
                        const { skippedAudio, skippedVideo, stallCount, lostPacketCount, nackCount } = this.player.computeStats();
                        this.deltaStats = { skippedAudio, skippedVideo, stallCount, lostPacketCount, nackCount };
                    }
                    this.trimStats(all);
                    if (all) {
                        this.hasMetrics = false;
                        this.deltaStats = {};
                    }
                },

                isPlaying() {
                    return this.playState === PlayState.PLAYING;
                },
                isStarting() {
                    return this.playState === PlayState.STARTING;
                },
                isStopped() {
                    return this.playState === PlayState.STOPPED;
                },

                // Keeps the address bar shareable: replaceState so settings tweaks don't stack history entries
                updateURL() {
                    const url = new URL(location.href);
                    setURLParam(url, 'endPoint', this.endPoint);
                    setURLParam(url, 'streamName', this.streamName.trim());
                    setURLParam(url, 'accessToken', this.accessToken.trim());
                    setURLParam(url, 'whep', this.connectorType === CONNECTOR_WHEP);
                    setURLParam(url, 'sidePanel', this.sidePanel);
                    replaceURL(url);
                }
            },
        }).mount('#main');
    </script>
</html>
